<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batteribytte ⚡</title>
<meta name="description" content="Det er tid for batteribytte! Er du klar?">
<meta name="theme-color" content="#05060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="bg"><div class="grid"></div></div>

  <div id="canArea">
    <div class="rays"></div>
    <div id="canMove" class="hidden">
      <div id="canBob">
        <svg id="can" viewBox="0 0 200 400" role="img" aria-label="Energidrikkboks med lynsymbol og batterimåler">
          <defs>
            <linearGradient id="metal" x1="0" x2="1">
              <stop offset="0" stop-color="#050505"/>
              <stop offset=".16" stop-color="#2b2b2b"/>
              <stop offset=".3" stop-color="#5c5c5c"/>
              <stop offset=".42" stop-color="#1c1c1c"/>
              <stop offset=".82" stop-color="#090909"/>
              <stop offset="1" stop-color="#2a2a2a"/>
            </linearGradient>
            <linearGradient id="silver" x1="0" x2="1">
              <stop offset="0" stop-color="#5c6066"/>
              <stop offset=".3" stop-color="#eef1f5"/>
              <stop offset=".52" stop-color="#9aa0a8"/>
              <stop offset=".76" stop-color="#e2e6eb"/>
              <stop offset="1" stop-color="#55595f"/>
            </linearGradient>
            <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7ff9a"/>
              <stop offset=".5" stop-color="#d4ff00"/>
              <stop offset="1" stop-color="#5dff4a"/>
            </linearGradient>
            <linearGradient id="shine" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0"/>
              <stop offset=".5" stop-color="#fff" stop-opacity=".32"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <clipPath id="bodyClip"><rect x="20" y="40" width="160" height="322"/></clipPath>
          </defs>

          <path d="M20 42 L34 16 Q100 6 166 16 L180 42 Z" fill="url(#silver)"/>
          <ellipse cx="100" cy="16" rx="66" ry="8" fill="#c9ced4" stroke="#7b8087"/>
          <ellipse cx="100" cy="16" rx="56" ry="5.5" fill="#9aa0a8"/>
          <g id="tab">
            <rect x="86" y="9" width="30" height="11" rx="5.5" fill="#e4e8ec" stroke="#80858c"/>
            <circle cx="108" cy="14.5" r="3" fill="#80858c"/>
          </g>

          <rect x="20" y="40" width="160" height="322" fill="url(#metal)"/>
          <g clip-path="url(#bodyClip)">
            <rect x="20" y="58" width="160" height="3" fill="#d4ff00"/>
            <text x="100" y="104" text-anchor="middle" font-family="Russo One, sans-serif" font-size="30" fill="#fff" letter-spacing="2">BATTERY</text>
            <text x="100" y="124" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#9ba1a8" letter-spacing="4">ENERGY DRINK</text>
            <polygon id="bolt" points="124,136 62,216 96,216 80,280 140,192 106,192 130,136" fill="url(#boltGrad)" filter="url(#glow)"/>
            <rect x="58" y="296" width="76" height="30" rx="5" fill="none" stroke="#fff" stroke-width="3"/>
            <rect x="134" y="304" width="7" height="14" rx="2" fill="#fff"/>
            <rect id="lvl" x="62" y="300" width="0" height="22" rx="2" fill="#d4ff00"/>
            <text id="pct" x="100" y="347" text-anchor="middle" font-family="Russo One, sans-serif" font-size="13" fill="#d4ff00">0%</text>
            <rect x="20" y="354" width="160" height="2" fill="#d4ff00"/>
            <g class="shine"><rect x="-90" y="30" width="56" height="340" fill="url(#shine)" transform="skewX(-14)"/></g>
          </g>

          <path d="M20 360 L32 386 Q100 396 168 386 L180 360 Z" fill="url(#silver)"/>
        </svg>
      </div>
    </div>
  </div>

  <div id="panels">
    <section id="intro">
      <h1 id="headline" aria-label="Det er tid for batteribytte!"></h1>
    </section>

    <section id="question">
      <h2>Er du klar?</h2>
      <div class="choices" id="choices">
        <label class="choice yes">
          <input type="checkbox" id="cbYes" name="klar" value="ja">
          <span class="box"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></span>
          Ja
        </label>
        <label class="choice no">
          <input type="checkbox" id="cbNo" name="klar" value="nei">
          <span class="box"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></span>
          Nei
        </label>
      </div>
    </section>

    <section id="yes">
      <h2 class="slam">FULLT LADET!</h2>
      <p>Batteriet er byttet. Nå kjører vi! ⚡</p>
      <button class="btn" id="againBtn" type="button">Én gang til</button>
    </section>

    <section id="no">
      <h2><span class="mini-batt" aria-hidden="true"><i></i></span><span id="noTitle"></span></h2>
      <p>Helt greit. Hvil litt – vi lader når du er klar.</p>
      <button class="btn" id="retryBtn" type="button">Prøv igjen</button>
    </section>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
</div>

<div id="flash"></div>
<button id="sound" type="button" aria-pressed="true">🔊 Lyd på</button>

<script src="app.js"></script>
</body>
</html>
