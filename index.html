<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Det er tid for batteribytte!</title>
<meta name="description" content="Det er tid for batteribytte! Er du klar?">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Det er tid for batteribytte!">
<meta property="og:description" content="Er du klar?">
<meta property="og:image" content="https://batteribytte.vercel.app/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tre Battery Fresh-bokser i et svart studio, den midterste lyser opp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/ArchivoBlack-400.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
<noscript><style>.hint, #sound { display: none; }</style></noscript>
</head>
<body>

<!-- Batteribytte: an interactive charging station. The can is a real photo; the light, sparks and sound are made
     live in the browser. Interaction spec: docs/interaction-spec.md -->
<main class="stage" id="stage" data-state="ask">
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <!-- «reisen»: the charging scene (journey.js); loaded after the first paint, shown only while charging -->
  <video class="journey" id="journey" muted playsinline preload="metadata" poster="assets/journey2-poster.jpg" aria-hidden="true" disablepictureinpicture></video>

  <header class="bar">
    <button class="chip" id="sound" type="button" aria-pressed="false" aria-keyshortcuts="M" title="Slå på lyd (M)">
      <svg class="ico on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="ico off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
      Lyd</button>
    <div class="hud low" id="hud" role="meter" aria-label="Batterinivå" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6" aria-valuetext="6 prosent">
      <span class="hud-bat" aria-hidden="true"><span class="hud-fill" id="hud-fill"></span></span>
      <span class="hud-pct" id="hud-pct" aria-hidden="true">6 %</span>
    </div>
  </header>

  <div class="scene" id="scene">
    <div class="spot" aria-hidden="true"></div>
    <div class="ring" id="ring" aria-hidden="true"></div>
    <div class="can" id="can">
      <div class="can-bob">
        <div class="can-body" id="can-body">
          <img class="can-img" src="assets/battery-fresh.webp" width="564" height="1476" alt="En boks Battery Fresh energidrikk" fetchpriority="high">
          <span class="can-glow" aria-hidden="true"></span>
          <span class="can-sheen" aria-hidden="true"></span>
        </div>
        <img class="can-reflect" src="assets/battery-fresh.webp" width="564" height="1476" alt="" aria-hidden="true">
      </div>
    </div>
    <div class="floor" aria-hidden="true"></div>
  </div>
  <div class="dim" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <div class="copy">
    <p class="kicker">Det er tid for</p>
    <h1 class="title" id="title" aria-label="Batteribytte!"><span class="nw">Batteri</span><wbr><span class="nw">bytte!</span></h1>
  </div>

  <div class="controls">
    <section class="panel" id="ask" aria-labelledby="ask-h">
      <h2 id="ask-h">Er du klar?</h2>
      <div class="choices" role="group" aria-labelledby="ask-h">
        <button class="choice yes" id="ja" type="button" aria-keyshortcuts="J" aria-describedby="hint" title="Ja (J)"><span class="charge" id="charge" aria-hidden="true"></span><span class="lbl">Ja</span></button>
        <button class="choice no" id="nei" type="button" aria-keyshortcuts="N" title="Nei (N)"><span class="lbl">Nei</span></button>
      </div>
      <p class="hint" id="hint">Hold <b>Ja</b> inne og lad selv – eller trykk og se på</p>
    </section>

    <section class="panel" id="yes" aria-labelledby="yes-h" hidden>
      <h2 id="yes-h">Fullt ladet!</h2>
      <p>Batteriet er byttet. Skål!</p>
      <div class="actions">
        <button class="chip big primary" id="share" type="button">Varsle kollegaene</button>
        <button class="chip big" id="again" type="button">Lad igjen</button>
      </div>
    </section>

    <section class="panel" id="no" aria-labelledby="no-h" hidden>
      <h2 id="no-h">Lavt batteri…</h2>
      <p>Helt greit. Vi venter til du er klar.</p>
      <button class="chip big" id="retry" type="button">Prøv igjen</button>
    </section>
  </div>

  <p class="toast" id="toast" role="status" hidden></p>
  <p class="sr-only" id="status" aria-live="polite"></p>
  <nav class="more" aria-label="Andre versjoner"><a href="film/">Filmversjonen</a><a href="v1/">Første versjon</a></nav>
</main>

<script src="app.js" defer></script>
<script src="journey.js" defer></script>
<script src="scene3d.js" defer></script>
</body>
</html>
