<!doctype html>
<html lang="no" data-om-signature="off" data-composition-variables='[
  {"id":"portrait","type":"boolean","label":"Stående format (9:16)","default":true},
  {"id":"line1","type":"string","label":"Tekst 1","default":"DET ER TID FOR"},
  {"id":"line2","type":"string","label":"Tekst 2","default":"BATTERI"},
  {"id":"line3","type":"string","label":"Tekst 3","default":"BYTTE!"},
  {"id":"ground","type":"color","label":"Studio","default":"#07070a"},
  {"id":"cold","type":"color","label":"Kaldt lys","default":"#dbe6ff"},
  {"id":"warm","type":"color","label":"Varmt lys (Ja)","default":"#ffc27a"}
]'>
<head>
<meta charset="utf-8">
<title>Batteribytte · placeholder-klipp</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/om.js"></script>
<script src="vendor/om-three.js"></script>
<style id="om-fonts">
@font-face { font-family: "Archivo Black"; src: url("assets/fonts/ArchivoBlack-400.woff") format("woff"); font-weight: 400; font-style: normal; }
</style>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
  #film { position: relative; width: 720px; height: 1280px; overflow: hidden; background: var(--ground); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* the hook: big stacked heavy type over the hero can (Dr Pepper grammar) */
  .type { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
          font-family: "Archivo Black", sans-serif; color: #f6f4f0; line-height: .86; letter-spacing: -.01em;
          text-shadow: 0 10px 60px rgba(0,0,0,.55); }
  .type .l1 { font-size: 84px; letter-spacing: .14em; line-height: 1.4; display: block; }
  .type .l2, .type .l3 { font-size: 230px; display: block; }
  .black { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-width="720" data-height="1280" data-fps="30">
  <canvas id="gl" data-om-id="scene"></canvas>
</div>

<script>
  const V = OM.vars();
  const P = !!V.portrait;
  const B = (n) => n * 0.5;                    // 120 bpm: beat n in seconds
  const rand = OM.random(7);

  // ---------- the studio: blue-black, soft boxes for reflections, fog, depth of field, bloom ----------
  const stage = OM3.stage(document.getElementById('gl'), {
    background: V.ground, fov: P ? 34 : 26, exposure: 1.0,
    envColors: { top: '#2a2c33', horizon: '#0e0f13', floor: '#050506' }, envIntensity: 0.6,
    dof: { aperture: 0.0016, maxblur: 0.008 }, bloom: { strength: 0.32, radius: 0.45, threshold: 0.93 }, fog: [13, 36],
  });
  const { THREE, scene } = stage;

  // ---------- the can: a lathe of the photo's own silhouette, the photo mapped straight on ----------
  const IMG_W = 564, IMG_H = 1476, CX = 282.5, TOP = 24, BOT = 1472, S = 4.0 / (BOT - TOP);
  const PROFILE = [[1472, 30], [1468, 110], [1464, 147.5], [1452, 199], [1444, 209.5], [1434, 222], [1424, 229], [1414, 246], [1404, 260],
    [1394, 270], [1384, 275.5], [1374, 277.5], [700, 278.5], [190, 277.5], [184, 277.5], [174, 276], [164, 274.5], [154, 271], [144, 267],
    [134, 263], [124, 259], [114, 254], [104, 248], [94, 242], [84, 236], [74, 230], [64, 226], [44, 223], [30, 225], [24, 225.5]];
  const RIM = 225.5 * S, HCAN = (BOT - TOP) * S;
  const BAR1 = { x: 96, y: 624, w: 140, h: 81 }, BAR2 = { x: 96, y: 726, w: 140, h: 54 };

  // label canvas = photo + condensation + the meter; bump = the drops
  const K = 2, label = document.createElement('canvas'), bump = document.createElement('canvas');
  label.width = bump.width = IMG_W * K; label.height = bump.height = IMG_H * K;
  const base = document.createElement('canvas'); base.width = label.width; base.height = label.height;
  const labelTex = new THREE.CanvasTexture(label); labelTex.colorSpace = THREE.SRGBColorSpace; labelTex.anisotropy = 8;
  const bumpTex = new THREE.CanvasTexture(bump);
  const photo = new Image(); photo.src = 'assets/battery-fresh.webp';
  let barCols = null, meterDrawn = '';
  OM3.ready(photo.decode().then(() => {
    const g = base.getContext('2d');
    g.drawImage(photo, 0, 0, base.width, base.height);
    // the paint behind the bars, sampled just right of them, row by row
    const px = g.getImageData(0, 0, base.width, base.height).data;
    const cols = (bar) => Array.from({ length: bar.h }, (_, i) => {
      const y = (bar.y + i) * K, x = (bar.x + bar.w + 10) * K, o = (y * base.width + x) * 4;
      return `rgb(${px[o]},${px[o + 1]},${px[o + 2]})`;
    });
    barCols = { b1: cols(BAR1), b2: cols(BAR2) };
    // condensation: many small drops, a few big ones, darker rim + sharp highlight; bump from the same drops
    const r = OM.random(11), bg = bump.getContext('2d');
    bg.fillStyle = '#000'; bg.fillRect(0, 0, bump.width, bump.height);
    for (let i = 0; i < 900; i++) {
      const y = (190 + r() * 1180) * K, x = (CX + (r() - 0.5) * 2 * 270) * K, rad = (0.8 + Math.pow(r(), 3.4) * 5.5) * K;
      const grad = g.createRadialGradient(x - rad * .3, y - rad * .35, rad * .1, x, y, rad);
      grad.addColorStop(0, 'rgba(255,255,255,.10)'); grad.addColorStop(.7, 'rgba(255,255,255,.04)');
      grad.addColorStop(.88, 'rgba(60,10,0,.30)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.beginPath(); g.ellipse(x, y, rad, rad * 1.12, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(x - rad * .32, y - rad * .4, rad * .26, rad * .18, -.5, 0, Math.PI * 2); g.fill();
      const bgr = bg.createRadialGradient(x, y, 0, x, y, rad);
      bgr.addColorStop(0, '#fff'); bgr.addColorStop(.8, '#aaa'); bgr.addColorStop(1, '#000');
      bg.fillStyle = bgr; bg.beginPath(); bg.ellipse(x, y, rad, rad * 1.12, 0, 0, Math.PI * 2); bg.fill();
    }
    bumpTex.needsUpdate = true;
    drawMeter(100, 0);
  }));

  // level 0–100 empties the bars from the right; under 20 the remainder turns red
  function drawMeter(level, red) {
    const id = Math.round(level * 2) + '|' + red.toFixed(2);
    if (!barCols || id === meterDrawn) return;
    meterDrawn = id;
    const g = label.getContext('2d');
    g.drawImage(base, 0, 0);
    const f = Math.max(0, Math.min(level, 100)) / 100;
    for (const [bar, cols] of [[BAR1, barCols.b1], [BAR2, barCols.b2]]) {
      const x0 = (bar.x + bar.w * f) * K;
      cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(x0, (bar.y + i) * K, (bar.w * (1 - f) + 1) * K, K); });
      if (red > 0) { g.fillStyle = `rgba(255,45,85,${red})`; g.fillRect((bar.x + 3) * K, (bar.y + 3) * K, Math.max(0, bar.w * f - 3) * K, (bar.h - 6) * K); }
    }
    labelTex.needsUpdate = true;
  }

  function lathe() {
    const pts = PROFILE.map(([row, hw]) => new THREE.Vector2(hw * S, (BOT - row) * S));
    const geo = new THREE.LatheGeometry(pts, 128);
    const pos = geo.attributes.position, uv = geo.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      uv.setXY(i, (CX + x / S) / IMG_W, 1 - (BOT - y / S) / IMG_H);   // straight-on projection of the photo
    }
    geo.computeVertexNormals();
    return geo;
  }
  const canGeo = lathe();
  const canMat = new THREE.MeshPhysicalMaterial({ map: labelTex, bumpMap: bumpTex, bumpScale: 1.2, metalness: 0.12, roughness: 0.38,
    clearcoat: 0.6, clearcoatRoughness: 0.2, envMapIntensity: 0.8 });
  const lidMat = new THREE.MeshPhysicalMaterial({ color: '#1b1b1e', metalness: 0.9, roughness: 0.28, clearcoat: 0.5 });
  const rimMat = new THREE.MeshPhysicalMaterial({ color: '#a9adb4', metalness: 1, roughness: 0.32, envMapIntensity: 0.6 });
  function makeCan() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(canGeo, canMat); body.castShadow = true; g.add(body);
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(RIM * 0.93, RIM * 0.93, 0.02, 96), lidMat); lid.position.y = HCAN - 0.035; g.add(lid);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(RIM * 0.97, 0.028, 16, 96), rimMat); rim.rotation.x = Math.PI / 2; rim.position.y = HCAN - 0.006; g.add(rim);
    const tab = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.22, 6, 16), rimMat); tab.rotation.set(Math.PI / 2, 0, Math.PI / 2); tab.scale.set(1, 1, 0.25);
    const tp = new THREE.Group(); tp.name = 'tabPivot'; tp.position.set(0, HCAN - 0.012, -0.02); g.add(tp);
    tab.position.set(0, 0, 0.14); tp.add(tab);
    return g;
  }
  const cans = [makeCan(), makeCan(), makeCan()];
  const hero = cans[1];
  cans[0].position.set(-1.95, 0, -0.45); cans[0].rotation.y = 0.18;
  cans[2].position.set(1.95, 0, -0.45); cans[2].rotation.y = -0.18;
  scene.add(...cans);

  // ---------- floor: dark, glossy, with the cans mirrored under it ----------
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshPhysicalMaterial({ color: '#050507', roughness: 0.3,
    clearcoat: 1, clearcoatRoughness: 0.15, transparent: true, opacity: 0.9, envMapIntensity: 0.3 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const mirror = new THREE.Group(); mirror.scale.y = -1; scene.add(mirror);
  cans.forEach((c) => { const m = c.clone(); m.traverse((o) => { if (o.material) { o.material = o.material.clone(); o.material.side = THREE.DoubleSide; } }); mirror.add(m); });

  // ---------- light ----------
  const cold = new THREE.Color(V.cold), warm = new THREE.Color(V.warm);
  const key = new THREE.DirectionalLight(cold, 1.2); key.position.set(-5, 7, 6); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); key.shadow.radius = 8;
  const rimL = new THREE.SpotLight(cold, 2.5, 0, 0.45, 0.7, 0); rimL.position.set(-6, 5, -6); rimL.target.position.set(0, 2, 0);
  const rimR = new THREE.SpotLight(cold, 2.5, 0, 0.45, 0.7, 0); rimR.position.set(6, 5, -6); rimR.target.position.set(0, 2, 0);
  const sweep = new THREE.SpotLight('#ffffff', 0, 0, 0.13, 0.55, 0); sweep.position.set(-7, 3.2, 7); sweep.target.position.set(-3, 2, 0);
  const back = new THREE.PointLight(warm, 0, 3.2, 1); back.position.set(0, 2.6, -0.95);
  // a narrow light on the hero's face: what makes it 'switch on' against its darker neighbours
  const fill = new THREE.SpotLight('#fff3e2', 0, 0, 0.12, 1, 0); fill.position.set(0, 2.2, 9); fill.target.position.set(0, 2.2, 0);
  scene.add(key, rimL, rimL.target, rimR, rimR.target, sweep, sweep.target, back, fill, fill.target);
  // the glow behind the hero can (with bloom it reads as light, not a sticker)
  const glowCv = document.createElement('canvas'); glowCv.width = glowCv.height = 256;
  { const g = glowCv.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,220,170,.55)'); gr.addColorStop(1, 'rgba(255,200,140,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256); }
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 6.4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(glowCv), color: warm,
    transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  glow.position.set(0, 1.9, -1.0); scene.add(glow);

  // ---------- fog: low rolling smoke on the floor, a cold breath from the top ----------
  function wisp(seed) {
    const r = OM.random(seed), c = document.createElement('canvas'); c.width = 512; c.height = 256;
    const g = c.getContext('2d'); g.filter = 'blur(18px)';
    for (let i = 0; i < 60; i++) {
      const x = 60 + r() * 392, y = 190 - Math.pow(r(), 1.5) * 110, rad = 26 + r() * 50, a = 0.08 * (1 - (190 - y) / 160);
      const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(235,240,255,${a})`); gr.addColorStop(1, 'rgba(235,240,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
    }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  }
  const WT = [1, 2, 3, 4].map(wisp);
  const smoke = Array.from({ length: 26 }, (_, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.5), new THREE.MeshBasicMaterial({ map: WT[i % 4], transparent: true, opacity: 0,
      depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
    m.userData = { x: -9 + rand() * 18, z: -3.5 + rand() * 6.5, y: 0.15 + rand() * 0.6, s: 3 + rand() * 4, v: (rand() - 0.5) * 0.35, a: 0.35 + rand() * 0.5, ph: rand() * 6 };
    scene.add(m); return m;
  });
  const breath = Array.from({ length: 6 }, (_, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.5), new THREE.MeshBasicMaterial({ map: WT[(i + 1) % 4], transparent: true, opacity: 0,
      depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
    m.userData = { dx: (rand() - 0.5) * 0.5, dz: (rand() - 0.5) * 0.3, rise: 0.8 + rand() * 0.9, s: 0.9 + rand() * 0.8, d: rand() * 0.25 };
    scene.add(m); return m;
  });


  // ---------- placeholder clips for the page (see ASSETS.md): four segments in one 14 s timeline ----------
  //   A idle   0–4    seamless loop at 6 %: a slow orbit, a glint across the label
  //   B charge 4–8    6 → 100 %, linear in time (scrubbed, 120 frames): macro drops → ice falls in slow motion and
  //                   splashes on the floor (low dutch angle) → the top of the can → a whip to the glowing hero
  //   C open   8–12   the crack: spray and foam in slow motion from above → foam runs down the side → whip to the
  //                   trio, lightning between the cans → push in
  //   D drain  10 → 12–14 the studio dies
  const D = 14.0;
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  OM.music({ off: true });
  const L = { key: 0.45, rim: 2.4, sweepX: -7, sweepI: 0, back: 2.5, glow: 0.5, fill: 2.6, fog: 0.9, breath: 0, level: 6, red: 1,
    smokeRise: 0, studio: 1, tab: 0, flash: 0, ice: -1, pour: -1, bolt: 0 };
  const cam = OM.space(stage.camera, { fov: 34 });
  const IDLE = { target: [0, 2.0, 0], distance: 13, yaw: -12, pitch: 4, roll: 0 };
  const HERO = { target: [0, 2.15, 0], distance: 10, yaw: 8, pitch: -5, roll: 0 };
  const cut = (at, pose) => cam.to(tl, at, { ...pose, duration: 0.001, ease: 'none' });
  const R_SIDE = 278.5 * S, HOLE = new THREE.Vector3(0, HCAN + 0.01, 0.13);
  const rng = (seed) => OM.random(seed);

  // ---------- props: ice, droplets, foam, lightning ----------
  function roundedBox(size, r, seg = 6) {
    const g = new THREE.BoxGeometry(size, size, size, seg, seg, seg), p = g.attributes.position, h = size / 2 - r, v = new THREE.Vector3(), c = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      c.set(Math.max(-h, Math.min(h, v.x)), Math.max(-h, Math.min(h, v.y)), Math.max(-h, Math.min(h, v.z)));
      v.sub(c).normalize().multiplyScalar(r).add(c); p.setXYZ(i, v.x, v.y, v.z);
    }
    g.computeVertexNormals(); return g;
  }
  // ice in a dark studio reads by its edges and its frost: half clear, a cold inner glow, a hard clearcoat
  const iceMat = new THREE.MeshPhysicalMaterial({ color: '#f2f8ff', transmission: 0.55, thickness: 0.3, roughness: 0.22, ior: 1.31,
    emissive: new THREE.Color('#2a3a4c'), emissiveIntensity: 0.6, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 2.2 });
  const iceGeo = roundedBox(0.34, 0.06);
  const ri = rng(21);
  const ICE = Array.from({ length: 8 }, (_, i) => {
    const m = new THREE.Mesh(iceGeo, iceMat); m.castShadow = true; m.visible = false; scene.add(m);
    const a = -1.1 + (i / 7) * 2.2 + (ri() - 0.5) * 0.3, rad = 1.0 + ri() * 0.9;
    return { m, x: Math.sin(a) * rad, z: Math.cos(a) * rad * 0.8 + 0.2, y0: HCAN + 1.6 + ri() * 2.2, t0: ri() * 0.5, s: 0.7 + ri() * 0.6,
      rx: (ri() - 0.5) * 6, ry: (ri() - 0.5) * 6, rz: (ri() - 0.5) * 6 };
  });
  // droplets: one instanced mesh for the drink (amber to red), one for clear water from the ice
  function dropMesh(n, color) {
    const m = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), new THREE.MeshPhysicalMaterial({ color, roughness: 0.03,
      clearcoat: 1, clearcoatRoughness: 0.02, transmission: 0.6, thickness: 0.04, ior: 1.34, emissive: new THREE.Color(color), emissiveIntensity: 0.25, envMapIntensity: 2 }), n);
    m.frustumCulled = false; scene.add(m); return m;
  }
  const amber = dropMesh(260, '#ffb257'), clear = dropMesh(88, '#e8f1ff');
  const DROPS = { amber: [], clear: [] };
  const rd = rng(33);
  for (let i = 0; i < 260; i++) {                                  // the crack: up and out of the hole
    const a = rd() * Math.PI * 2, up = 2.6 + rd() * 4.2, out = 0.4 + rd() * 2.4;
    DROPS.amber.push({ key: 'pour', t0: rd() * 0.18, p: HOLE.clone(), v: new THREE.Vector3(Math.cos(a) * out, up, Math.sin(a) * out * 0.8 + 0.6),
      r: 0.006 + Math.pow(rd(), 2.5) * 0.026, red: rd() < 0.3 });
  }
  ICE.forEach((c, k) => {                                          // each cube splashes where it lands
    const th = c.t0 + Math.sqrt((2 * (c.y0 - 0.17)) / 9.8);
    for (let i = 0; i < 11; i++) {
      const a = rd() * Math.PI * 2, s = 0.6 + rd() * 1.6;
      DROPS.clear.push({ key: 'ice', t0: th, p: new THREE.Vector3(c.x, 0.05, c.z), v: new THREE.Vector3(Math.cos(a) * s, 1.2 + rd() * 2.4, Math.sin(a) * s), r: 0.01 + rd() * 0.025 });
    }
  });
  const redCol = new THREE.Color('#e25070'), ambCol = new THREE.Color('#ffb257');
  DROPS.amber.forEach((d, i) => amber.setColorAt(i, d.red ? redCol : ambCol));
  // foam: soft blobs that rise out of the hole, spread over the lid, spill over the rim and run down the side
  // many small, flattened, half-translucent bubbles that overlap: reads as foam, not as balls
  const foamMat = new THREE.MeshPhysicalMaterial({ color: '#fff4e2', roughness: 0.32, sheen: 1, sheenColor: new THREE.Color('#ffcf8a'),
    clearcoat: 0.8, clearcoatRoughness: 0.15, transmission: 0.35, thickness: 0.05, ior: 1.33, emissive: new THREE.Color('#3a2a14'), emissiveIntensity: 0.35 });
  const FN = 1100, foam = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), foamMat, FN);
  foam.frustumCulled = false; foam.castShadow = true; scene.add(foam);
  const rf = rng(44);
  const FOAM = Array.from({ length: FN }, (_, i) => {
    const u = i / FN, front = rf() < 0.75;                         // most of it spills toward the front
    return { e: u * 0.9 + rf() * 0.08, a: front ? (rf() - 0.5) * 2.0 : rf() * Math.PI * 2, rr: Math.sqrt(rf()),
      spill: rf() < 0.62, stop: 0.3 + Math.pow(rf(), 0.7) * 2.6, sp: 2.2 + rf() * 1.6, s: 0.012 + Math.pow(rf(), 2.2) * 0.04 };
  });
  // lightning: a jagged tube rebuilt for every strike, very bright so the bloom makes it glow
  const boltMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 4.6, 6.5), toneMapped: false });
  const boltGlow = new THREE.PointLight('#bcd2ff', 0, 8, 1.4); scene.add(boltGlow);
  let bolts = [], boltKey = '';
  function jag(a, b, seed) {
    const r = rng(seed); let pts = [a.clone(), b.clone()];
    for (let lv = 0; lv < 5; lv++) {
      const next = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const m = pts[i].clone().add(pts[i + 1]).multiplyScalar(0.5), len = pts[i].distanceTo(pts[i + 1]);
        m.add(new THREE.Vector3((r() - 0.5), (r() - 0.5), (r() - 0.5) * 0.6).multiplyScalar(len * 0.45));
        next.push(m, pts[i + 1]);
      }
      pts = next;
    }
    return pts;
  }
  const ARCS = [[[-1.4, 3.2, -0.4], [-0.62, 3.0, 0]], [[0.62, 2.6, 0], [1.4, 2.9, -0.4]], [[-1.5, 3.9, -0.45], [1.5, 3.9, -0.45]]];
  function setBolts(on, seed) {
    const k = on ? 'b' + seed : '';
    if (k === boltKey) return; boltKey = k;
    bolts.forEach((m) => { scene.remove(m); m.geometry.dispose(); }); bolts = [];
    if (!on) return;
    ARCS.forEach(([a, b], j) => {
      if (j === 2 && seed % 2) return;
      const pts = jag(new THREE.Vector3(...a), new THREE.Vector3(...b), seed * 7 + j);
      const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 96, 0.02, 5, false), boltMat);
      scene.add(m); bolts.push(m);
    });
  }

  // ---------- A · idle: a slow orbit that closes on itself, a glint across the label ----------
  cam.set(IDLE);
  cam.to(tl, 0, { yaw: 2, distance: 11.8, pitch: 6, duration: 2, ease: 'sine.inOut' });
  cam.to(tl, 2, { yaw: -12, distance: 13, pitch: 4, duration: 2, ease: 'sine.inOut' });
  tl.fromTo(L, { sweepX: -4, sweepI: 0 }, { sweepX: 4, sweepI: 4, duration: 1.4, ease: 'sine.inOut' }, 1.0).set(L, { sweepI: 0 }, 2.4);

  // ---------- B · charge (scrubbed): macro → ice → top → whip to the hero ----------
  tl.addLabel('charge', 4);
  cam.to(tl, 4.0, { target: [-0.25, 1.7, 0.72], distance: 1.45, yaw: -20, pitch: 2, duration: 1.0, ease: 'power2.in' });
  tl.fromTo(L, { sweepX: -3, sweepI: 0 }, { sweepX: 3, sweepI: 6, duration: 0.9, ease: 'sine.inOut' }, 4.1).set(L, { sweepI: 0 }, 5.0);
  cut(5.0, { target: [0.35, 0.9, 1.0], distance: 3.4, yaw: 38, pitch: -7, roll: -9 });
  cam.to(tl, 5.002, { yaw: 30, distance: 3.0, roll: -6, duration: 1.1, ease: 'sine.out' });
  tl.fromTo(L, { ice: 0 }, { ice: 1.55, duration: 1.1, ease: 'power2.out' }, 5.0);    // slow motion that slows further
  cut(6.1, { target: [0, HCAN - 0.1, 0.1], distance: 2.3, yaw: -8, pitch: 36, roll: 3 });
  cam.to(tl, 6.102, { pitch: 22, distance: 2.0, duration: 0.9, ease: 'sine.inOut' });
  tl.fromTo(L, { breath: 0 }, { breath: 0.8, duration: 0.9, ease: 'power2.out' }, 6.1).set(L, { breath: 0 }, 7.0);
  cam.to(tl, 7.0, { yaw: 70, distance: 4, duration: 0.22, ease: 'expo.in' });               // whip …
  cut(7.22, { ...HERO, yaw: -30, distance: 8 });
  cam.to(tl, 7.222, { ...HERO, duration: 0.778, ease: 'expo.out' });                         // … into the hero
  tl.fromTo(L, { level: 6 }, { level: 100, duration: 4, ease: 'none' }, 4.0)
    .to(L, { back: 9, glow: 1.6, fill: 4.2, rim: 3.5, duration: 4, ease: 'power2.in' }, 4.0);

  // ---------- C · open: anticipation, the crack in slow motion, foam, lightning ----------
  tl.addLabel('open', 8);
  tl.set(L, { level: 100, back: 9, glow: 1.6, fill: 4.2, rim: 3.5, ice: 1.55 }, 8.0);
  cam.to(tl, 8.0, { distance: 10.7, pitch: -4, duration: 0.25, ease: 'power2.in' });
  tl.to(L, { tab: 1, duration: 0.1, ease: 'expo.out' }, 8.25)
    .fromTo(L, { flash: 1 }, { flash: 0, duration: 0.45, ease: 'expo.out' }, 8.25)
    .fromTo(L, { breath: 0 }, { breath: 1, duration: 1.2, ease: 'power2.out' }, 8.25).set(L, { breath: 0 }, 9.5)
    // speed ramp: very slow after the crack, then real time
    .fromTo(L, { pour: 0 }, { pour: 0.6, duration: 0.75, ease: 'sine.in' }, 8.25)
    .to(L, { pour: 2.2, duration: 1.0, ease: 'power2.in' }, 9.0)
    .to(L, { pour: 3.4, duration: 2.0, ease: 'power1.out' }, 10.0)
    .to(L, { fog: 1.5, smokeRise: 1, duration: 1.5, ease: 'power2.out' }, 10.0);
  cut(8.25, { target: [0, HCAN + 0.05, 0.1], distance: 1.35, yaw: 18, pitch: 40, roll: 5 });
  cam.to(tl, 8.252, { distance: 1.6, pitch: 30, roll: 2, duration: 0.75, ease: 'sine.out' });
  cut(9.0, { target: [0.1, HCAN - 0.45, 0.6], distance: 2.1, yaw: 16, pitch: 12, roll: -4 });
  cam.to(tl, 9.002, { target: [0.1, HCAN - 1.3, 0.6], pitch: 5, duration: 0.8, ease: 'sine.inOut' });
  cam.to(tl, 9.8, { yaw: -40, duration: 0.2, ease: 'expo.in' });
  cut(10.0, { target: [0, 2.0, 0], distance: 15.5, yaw: 6, pitch: 2, roll: -3 });
  cam.to(tl, 10.002, { distance: 12.5, yaw: -3, roll: 0, duration: 2, ease: 'power3.out' });
  // the strikes (one rebuilt bolt set per flash)
  [[10.05, 10.12], [10.18, 10.27], [10.4, 10.5], [10.62, 10.7], [10.86, 10.98], [11.3, 11.36]].forEach(([a, b], i) =>
    tl.set(L, { bolt: i + 1 }, a).set(L, { bolt: 0 }, b));

  // ---------- D · drain: from the idle frame, the studio dies ----------
  tl.addLabel('drain', 12);
  cut(12.0, IDLE);
  tl.set(L, { key: 0.45, rim: 2.4, back: 2.5, glow: 0.5, fill: 2.6, fog: 0.9, smokeRise: 0, level: 6, studio: 1, tab: 0, flash: 0, ice: -1, pour: -1 }, 12.0)
    .to(L, { studio: 0.12, fog: 0.35, duration: 1.4, ease: 'power2.in' }, 12.2)
    .to(L, { level: 0, duration: 1.2, ease: 'power1.in' }, 12.2);
  cam.to(tl, 12.002, { target: [0, 1.6, 0], distance: 14.5, pitch: 20, duration: 1.998, ease: 'power2.inOut' });
  tl.to({}, { duration: 0 }, D);

  // ---------- draw ----------
  const camPos = new THREE.Vector3(), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e3 = new THREE.Euler(), v3 = new THREE.Vector3(), sc = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const tabs = [hero.getObjectByName('tabPivot'), mirror.children[1].getObjectByName('tabPivot')];
  const hide = (mesh, n) => { m4.makeScale(0, 0, 0); for (let i = 0; i < n; i++) mesh.setMatrixAt(i, m4); mesh.instanceMatrix.needsUpdate = true; };
  function drops(mesh, list, sim) {
    list.forEach((d, i) => {
      const s = sim[d.key] - d.t0;
      if (!(s > 0) || s > 1.8) { m4.makeScale(0, 0, 0); mesh.setMatrixAt(i, m4); return; }
      v3.copy(d.v).multiplyScalar(s).add(d.p); v3.y -= 4.9 * s * s;
      if (v3.y < d.r) { m4.makeScale(0, 0, 0); mesh.setMatrixAt(i, m4); return; }
      const vy = d.v.y - 9.8 * s, sp = Math.hypot(d.v.x, vy, d.v.z);
      q.setFromUnitVectors(up, sc.set(d.v.x, vy, d.v.z).normalize());
      const life = Math.min(1, (1.8 - s) * 3);
      m4.compose(v3, q, sc.set(d.r * life, d.r * life * (1 + Math.min(1.5, sp * 0.12)), d.r * life)); mesh.setMatrixAt(i, m4);
    });
    mesh.instanceMatrix.needsUpdate = true;
  }
  OM3.film(stage, tl, D, cam, (t) => {
    const s = L.studio;
    key.intensity = L.key * s; rimL.intensity = rimR.intensity = L.rim * s;
    sweep.intensity = L.sweepI * s; sweep.position.x = L.sweepX; sweep.target.position.x = L.sweepX * 0.5;
    back.intensity = (L.back + L.flash * 30) * s; fill.intensity = L.fill * s; glow.material.opacity = Math.min(1, L.glow * 0.38 + L.flash * 0.5) * s;
    glow.scale.setScalar(1 + (L.glow - 1) * 0.25);
    stage.renderer.toneMappingExposure = (0.35 + 0.65 * s) + L.flash * 0.45;
    const inCharge = t >= 4 && t < 8;
    const blink = L.level < 20 ? (inCharge ? 1 : (Math.floor(t * 2) % 2 === 0 ? 1 : 0.35)) : 0;
    drawMeter(L.level, blink);
    tabs.forEach((p) => { if (p) p.rotation.x = -L.tab * 1.15; });
    stage.camera.getWorldPosition(camPos);
    smoke.forEach((m, i) => {
      const u = m.userData, x = u.x + Math.sin((t / 4) * Math.PI * 2 + u.ph) * 0.45;
      m.position.set(x, u.y + L.smokeRise * (0.6 + (i % 3) * 0.3), u.z);
      m.scale.set(u.s, u.s * 0.55, 1); m.lookAt(camPos);
      m.material.opacity = u.a * 0.1 * L.fog * s;
    });
    breath.forEach((m) => {
      const u = m.userData, p = Math.max(0, Math.min(1, (L.breath - u.d) / (1 - u.d)));
      m.position.set(u.dx * p, HCAN + 0.05 + p * u.rise, u.dz + 0.1);
      m.scale.set(u.s * (0.4 + p), u.s * (0.3 + p * 0.7), 1); m.lookAt(camPos);
      m.material.opacity = Math.sin(p * Math.PI) * 0.55;
    });
    // ice: falls (in the slowed time of the shot), one small bounce, then rests
    ICE.forEach((c) => {
      const st = L.ice - c.t0;
      c.m.visible = L.ice >= 0;
      if (!c.m.visible) return;
      const th = Math.sqrt((2 * (c.y0 - 0.17)) / 9.8);
      let y, spin = Math.max(0, st);
      if (st < 0) y = c.y0;
      else if (st < th) y = c.y0 - 4.9 * st * st;
      else { const b = st - th, vb = 9.8 * th * 0.22; y = Math.max(0.17, 0.17 + vb * b - 4.9 * b * b); spin = th + Math.min(b, 0.3) * 0.4; }
      c.m.position.set(c.x, y, c.z); c.m.scale.setScalar(c.s);
      c.m.rotation.set(c.rx * spin * 0.4, c.ry * spin * 0.4, c.rz * spin * 0.4);
    });
    const sim = { pour: L.pour, ice: L.ice };
    if (L.pour >= 0) drops(amber, DROPS.amber, sim); else hide(amber, 260);
    if (L.ice >= 0) drops(clear, DROPS.clear, sim); else hide(clear, 90);
    // foam
    if (L.pour < 0) hide(foam, FN);
    else FOAM.forEach((f, i) => {
      const s2 = L.pour - f.e;
      if (s2 <= 0) { m4.makeScale(0, 0, 0); foam.setMatrixAt(i, m4); return; }
      const grow = Math.min(1, s2 / 0.25), size = f.s * (0.4 + 0.6 * grow);
      let x, y, z;
      const rTop = f.rr * RIM * 0.95;
      if (s2 < 0.2 || !f.spill) {                                  // rise out of the hole and spread over the lid
        const k = Math.min(1, s2 / 0.2), e = 1 - Math.pow(1 - k, 3);
        x = HOLE.x + (Math.sin(f.a) * rTop - HOLE.x) * e; z = HOLE.z + (Math.cos(f.a) * rTop - HOLE.z) * e;
        y = HCAN + 0.02 + size * 0.6 + Math.sin(k * Math.PI) * 0.12;
      } else if (s2 < 0.35) {                                      // over the rim
        const k = (s2 - 0.2) / 0.15, r = rTop + (RIM * 1.04 - rTop) * k;
        x = Math.sin(f.a) * r; z = Math.cos(f.a) * r; y = HCAN + 0.02 + size * 0.6 - k * 0.12;
      } else {                                                     // run down the side, slowing to a stop
        const k = s2 - 0.35, d = f.stop * (1 - Math.exp(-k * f.sp));
        const yy = HCAN - 0.1 - d, rad = (yy > HCAN - 0.45 ? RIM + (R_SIDE - RIM) * Math.min(1, (HCAN - 0.1 - yy) / 0.35) : R_SIDE) + size * 0.55;
        x = Math.sin(f.a) * rad; z = Math.cos(f.a) * rad; y = yy;
      }
      const drip = s2 > 0.35 && f.spill ? 1.7 : 0.7;                // flattened on the lid, stretched where it runs
      m4.compose(v3.set(x, y, z), q.identity(), sc.set(size * 1.15, size * drip, size * 1.15)); foam.setMatrixAt(i, m4);
    });
    foam.instanceMatrix.needsUpdate = true;
    // lightning
    setBolts(L.bolt > 0, L.bolt);
    boltGlow.position.set(0, 3.2, 0.2); boltGlow.intensity = L.bolt > 0 ? 45 : 0;
  });

  window.__timelines['film'] = tl;
</script>
